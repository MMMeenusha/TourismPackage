name: Tourism Project Pipeline

on:
  push:
    branches:
      - main            # runs automatically on every push to main
  workflow_dispatch:    # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write       # needed so the pipeline can commit the trained model

# If several pushes arrive close together, only the newest run continues
concurrency:
  group: tourism-pipeline
  cancel-in-progress: true

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5

      - name: Train Model
        run: python tourism_project/model_building/train.py

      - name: Verify Trained Model
        run: |
          python - <<'PY'
          import joblib
          import pandas as pd
          from sklearn.pipeline import Pipeline

          path = "tourism_project/deployment/tourism_package_v1_0.joblib"
          model = joblib.load(path)

          assert isinstance(model, Pipeline), f"Expected Pipeline, got {type(model)}"
          model.named_steps["xgbclassifier"].get_booster()    # raises NotFittedError if unfitted

          sample = pd.read_csv("Xtest.csv").head(5)
          proba = model.predict_proba(sample)[:, 1]
          print("Model verification successful. Sample probabilities:", proba.round(3))
          print("Pipeline steps:", list(model.named_steps))
          PY

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/tourism_package_v1_0.joblib

          if git diff --cached --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "Update trained tourism model [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
